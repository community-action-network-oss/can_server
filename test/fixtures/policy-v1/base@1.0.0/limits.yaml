# Per-account caps, field bounds and cooldowns. Pack values, never code constants.
# Defaults: docs/open-questions/OQ-limits.md and docs/design/ai/decision-points.md.
# Rules and the public: false convention: docs/limits.md
schema_version: 1
caps:
  problems_per_account_per_period:
    count: 3
    days: 7
    note: Problems one account may submit per period.
  contributions_per_account_per_day:
    total: 20
    note: All contribution types except the exempt ones under cooldowns. Per-problem volume is governed by replies_per_account_per_problem_per_day (D-85).
  proposals_per_account_per_problem:
    value: 2
    note: Proposals one account may make on one problem.
  open_drafts_per_account:
    value: 5
    note: Unsubmitted drafts.
  appeals_per_account_per_period:
    count: 3
    days: 7
    note: Appeals per period.
  policy_proposals_per_account_per_period:
    count: 2
    days: 7
    provisional: true
    note: Policy proposals one account may send per period. Read by can_server policy-proposals.
  replies_per_account_per_problem_per_day:
    count: 4
    days: 1
    provisional: true
    public: true
    note: D-85. Replies one account may make on one problem in a rolling 24 hours, so every reply counts. Read by can_server contributions.
# Entries are added by the content schema units. Char bounds equal the schema x-guidance.
# List sizes (sources 1 to 10, facts 1 to 10, criteria 1 to 6, assumptions 1 to 8) live in
# content-schemas/problem/schema.json as minItems and maxItems: this file allows one list key per type.
fields:
  problem:
    condition:
      min_chars: 40
      max_chars: 400
      note: Length of the shared public condition.
    causal_hypothesis:
      min_chars: 40
      max_chars: 600
      note: Length of the causal hypothesis statement.
  # Contribution types: key is the schema folder name. Evidence ref and assumption list sizes are in the schemas.
  contribution.clarifying_question:
    claim:
      min_chars: 20
      max_chars: 500
      note: Length of the contribution claim.
    list:
      min: 0
      max: 6
      note: Evidence refs per contribution, 0 to 6.
  contribution.observation:
    claim:
      min_chars: 20
      max_chars: 500
      note: Length of the contribution claim.
    list:
      min: 0
      max: 6
      note: Evidence refs per contribution, 0 to 6.
  contribution.personal_experience:
    claim:
      min_chars: 20
      max_chars: 500
      note: Length of the contribution claim.
    list:
      min: 0
      max: 6
      note: Evidence refs per contribution, 0 to 6.
  contribution.factual_claim:
    claim:
      min_chars: 20
      max_chars: 500
      note: Length of the contribution claim.
    list:
      min: 0
      max: 6
      note: Evidence refs per contribution, 0 to 6.
  contribution.evidence:
    claim:
      min_chars: 20
      max_chars: 500
      note: Length of the contribution claim.
    list:
      min: 0
      max: 6
      note: Evidence refs per contribution, 0 to 6.
  contribution.interpretation:
    claim:
      min_chars: 20
      max_chars: 500
      note: Length of the contribution claim.
    list:
      min: 0
      max: 6
      note: Evidence refs per contribution, 0 to 6.
  contribution.root_cause:
    claim:
      min_chars: 20
      max_chars: 500
      note: Length of the contribution claim.
    list:
      min: 0
      max: 6
      note: Evidence refs per contribution, 0 to 6.
  contribution.constraint:
    claim:
      min_chars: 20
      max_chars: 500
      note: Length of the contribution claim.
    list:
      min: 0
      max: 6
      note: Evidence refs per contribution, 0 to 6.
  contribution.stakeholder_perspective:
    claim:
      min_chars: 20
      max_chars: 500
      note: Length of the contribution claim.
    list:
      min: 0
      max: 6
      note: Evidence refs per contribution, 0 to 6.
  contribution.proposed_solution:
    claim:
      min_chars: 20
      max_chars: 500
      note: Length of the contribution claim.
    list:
      min: 0
      max: 6
      note: Evidence refs per contribution, 0 to 6.
  contribution.proposal_improvement:
    claim:
      min_chars: 20
      max_chars: 500
      note: Length of the contribution claim.
    list:
      min: 0
      max: 6
      note: Evidence refs per contribution, 0 to 6.
  contribution.risk:
    claim:
      min_chars: 20
      max_chars: 500
      note: Length of the contribution claim.
    list:
      min: 0
      max: 6
      note: Evidence refs per contribution, 0 to 6.
  contribution.implementation_offer:
    claim:
      min_chars: 20
      max_chars: 500
      note: Length of the contribution claim.
    list:
      min: 0
      max: 6
      note: Evidence refs per contribution, 0 to 6.
  contribution.progress_update:
    claim:
      min_chars: 20
      max_chars: 500
      note: Length of the contribution claim.
    list:
      min: 0
      max: 6
      note: Evidence refs per contribution, 0 to 6.
  contribution.verification_evidence:
    claim:
      min_chars: 20
      max_chars: 500
      note: Length of the contribution claim.
    list:
      min: 0
      max: 6
      note: Evidence refs per contribution, 0 to 6.
  # Stage content types. One list key per type; the other list sizes are minItems and maxItems in the schemas.
  stage_option:
    option_statement:
      min_chars: 20
      max_chars: 500
      note: Length of the option statement.
    mechanism:
      min_chars: 20
      max_chars: 500
      note: Length of the mechanism.
    responsible_role:
      min_chars: 5
      max_chars: 150
      note: Length of the responsible role.
    authority_and_legal_basis:
      min_chars: 20
      max_chars: 500
      note: Length of the authority and legal basis.
    funding:
      min_chars: 10
      max_chars: 300
      note: Length of the funding note.
    risks_and_rights_impact:
      min_chars: 20
      max_chars: 500
      note: Length of the risks and rights impact.
    list:
      min: 1
      max: 6
      note: Criteria an option maps to, 1 to 6.
  stage_choice:
    decider_role:
      min_chars: 5
      max_chars: 150
      note: Length of the decider role.
    authority:
      min_chars: 10
      max_chars: 300
      note: Length of the authority statement.
    rationale:
      min_chars: 20
      max_chars: 600
      note: Length of the rationale.
    list:
      min: 1
      max: 12
      note: Steps in one choice, 1 to 12.
  stage_evidence:
    outcome_statement:
      min_chars: 20
      max_chars: 500
      note: Length of the outcome statement.
    what_the_evidence_does_not_show:
      min_chars: 10
      max_chars: 300
      note: Length of the limits statement.
    list:
      min: 1
      max: 6
      note: Evidence refs per item, 1 to 6.
  review_recommendation:
    recommendation:
      min_chars: 20
      max_chars: 600
      note: Length of the change a volunteer asks for.
    reason:
      min_chars: 20
      max_chars: 600
      note: Length of the reason for the change.
    resolution_reason:
      min_chars: 10
      max_chars: 600
      note: Length of the poster reason for accepting or declining.
  # Archive types are system-built: no free-text field has a char bound here, only list sizes.
  archive_record:
    list:
      min: 1
      max: 12
      note: Stages in executed_path, equal to the problem stage plan cap.
  path_suggestion:
    list:
      min: 1
      max: 12
      note: Stages in draft_stages, equal to the problem stage plan cap.
  stage_draft:
    list:
      min: 1
      max: 12
      note: Stages in the draft plan, equal to the problem stage plan cap.
  decision_record:
    decider_role:
      min_chars: 5
      max_chars: 150
      note: Length of the decider role.
    authority:
      min_chars: 10
      max_chars: 300
      note: Length of the authority statement.
    rationale:
      min_chars: 20
      max_chars: 600
      note: Length of the rationale.
    list:
      min: 1
      max: 12
      note: Steps in one record, 1 to 12.
  task:
    question_answered:
      min_chars: 10
      max_chars: 300
      note: Length of the question the task answers.
    deliverable:
      min_chars: 10
      max_chars: 300
      note: Length of the deliverable.
    owner_role:
      min_chars: 5
      max_chars: 150
      note: Length of the owner role.
    list:
      min: 1
      max: 6
      note: Done criteria per task, 1 to 6.
  verification:
    success_metric_restated:
      min_chars: 10
      max_chars: 300
      note: Length of the restated success measure.
    what_the_evidence_does_not_show:
      min_chars: 10
      max_chars: 300
      note: Length of the limits statement.
    list:
      min: 1
      max: 6
      note: Evidence refs per verification, 1 to 6.
cooldowns:
  between_contributions_same_problem:
    seconds: 120
    provisional: true
    note: Reflection delay, final length is OQ-cooldown-lengths.
  after_rejected_contribution:
    seconds: 600
    provisional: true
    note: Delay after a reject, final length is OQ-cooldown-lengths.
  exempt_types:
    value: [progress_update, verification_evidence]
    note: Never delayed and not counted against the daily contribution cap.
grace:
  schema_major_draft_days:
    value: 30
    unit: days
    note: How long an old-major draft stays usable after a schema major bump.
risk_period:
  burst_threshold:
    public: false
    provisional: true
    value:
      events: 37
      window_seconds: 90
    note: Burst that tightens caps. Never shown in any explanation.
# Legal retrieval budgets (docs/design/ai/legal-stack.md section 3). Code holds no number.
legal:
  retrieval:
    max_articles_per_layer:
      value: 3
      provisional: true
      note: Top articles taken from one layer's topic index per run.
    token_budget_per_run:
      value: 2500
      unit: tokens
      provisional: true
      note: Total tokens of legal articles in one run's rules slice.
    low_confidence_floor:
      value: 0.6
      provisional: true
      note: Retrieval confidence below this on a risky topic escalates to a stronger model, then hold.
    risky_topics:
      value: [public-order, criminal-procedure, explosives-and-weapons, data-protection-implementation]
      provisional: true
      note: Topic slugs that escalate on low retrieval confidence. Slugs match the topic areas in the legal index stubs.
# Archive reuse ranking (docs/design/ai/archive-reuse.md section 5). Reuse keeps personal-data stripping:
# these values tune ranking only and never widen what an archive record may hold.
archive:
  rank_weights:
    problem_type: 0.25
    constraints: 0.15
    resources_budget: 0.15
    scale: 0.10
    geography_climate: 0.10
    institutions: 0.10
    legal_stack: 0.10
    language: 0.05
    provisional: true
    note: Per-dimension weights of the reuse score. They must sum to 1.0 (tested).
  completeness_bonus:
    value: 0.05
    provisional: true
    note: Score bonus for a complete archive record.
  solved_bonus:
    value: 0.05
    provisional: true
    note: Score bonus for a solved outcome. Failed paths still rank and show as warnings.
  derank_factor:
    value: 0.5
    provisional: true
    note: Multiplier applied to a candidate that is demoted.
  min_candidate_score:
    value: 0.35
    provisional: true
    note: Candidates below this score are never shown.
  rrf_k:
    value: 60
    provisional: true
    note: Reciprocal rank fusion constant.
  top_k_fusion:
    value: 30
    provisional: true
    note: Candidates kept from each retriever before fusion.
  top_n_shown:
    value: 5
    provisional: true
    note: Suggestions shown to the poster.
  max_per_source_problem:
    value: 2
    provisional: true
    note: Diversity rule, suggestions from one source problem.
  taxonomy:
    value: content-schemas/problem/taxonomy.yaml
    provisional: true
    note: One file reference holding the problem type and category ids (x-checks taxonomy in the problem schema). The file itself is added by a later unit.
  cross_language_recall_floor:
    value: 0.7
    provisional: true
    note: Minimum recall of cross-language retrieval in eval before a language is served.
metrics:
  min_n:
    value: 20
    provisional: true
    note: Smallest sample before a rate or share is shown. OQ-limits.
# Live path suggestions while a draft is prepared (archive-reuse.md section 7).
suggestions:
  debounce_trailing_seconds:
    seconds: 5
    provisional: true
    note: Trailing run after this quiet time per draft.
  idle_typing_seconds:
    seconds: 1.5
    provisional: true
    note: A change event fires after this idle typing time.
  max_runs_per_hour_per_draft:
    value: 6
    provisional: true
    note: Suggestion runs one draft may start per hour.
  stage_draft_expiry_days:
    value: 30
    unit: days
    provisional: true
    note: A stage draft not touched for this long expires.
  run_budget_micro_usd:
    value: 20000
    unit: micro_usd
    provisional: true
    note: Cost ceiling of one suggestion run, counted against the D-65 caps.
# Volunteer review (D-74 defaults). At least one completed review is a constant in code, not a limit.
review:
  quorum_completed_reviews:
    value: 3
    provisional: true
    note: Completed reviews that make a quorum.
  recommendation_open_max_days:
    value: 7
    unit: days
    provisional: true
    note: How long a review recommendation stays open.
  publish_anyway_after_days:
    value: 14
    unit: days
    provisional: true
    note: Days after which the poster may publish without a quorum.
stage:
  auto_start_default:
    value: true
    provisional: true
    note: Whether a stage starts by itself when the previous one ends.
# Location check (docs/design/location/attestation.md). Only the label and three coarse fields are stored,
# never a location. Counters are keyed on account id and area, not on position. Open: OQ-limits, OQ-h3-resolution.
location:
  k_min_cells:
    value: 25
    provisional: true
    note: Fewest cells in an affected area, about 18 km2 at resolution 8. OQ-h3-resolution.
  h3_resolution:
    value: 8
    provisional: true
    note: H3 resolution of area cells. OQ-h3-resolution.
  challenge_ttl_seconds:
    seconds: 120
    provisional: true
    note: Life of a location challenge, deleted on use or expiry.
  rate_per_account_per_area_per_hour:
    value: 10
    public: false
    provisional: true
    note: Location checks one account may send per area per hour before it is labelled guest. OQ-limits.
  rate_per_account_per_day:
    value: 40
    public: false
    provisional: true
    note: Location checks one account may send per day. OQ-limits.
  impacted_cap_per_area_per_day:
    value: 200
    public: false
    provisional: true
    note: Impacted labels per area per day, later ones are guest pending review of the surge. OQ-limits.
  surge_new_account_days:
    value: 7
    unit: days
    public: false
    provisional: true
    note: An account younger than this counts as new for the surge downgrade. OQ-limits.
  plausibility_max_speed_kmh:
    value: 900
    public: false
    provisional: true
    note: Fastest plausible movement between two checks. OQ-limits.
  history_ttl_hours:
    value: 24
    unit: hours
    provisional: true
    note: Rate counters live for the window length only, never a location trail.
