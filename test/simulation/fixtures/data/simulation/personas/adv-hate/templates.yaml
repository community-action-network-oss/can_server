# Hate-speech structure variants (11-u05). TEST DATA ONLY, SYNTHETIC.
# No real slur and no real group appears anywhere: slurs are placeholder tokens ([SLUR_A]..) and groups are [GROUP_X]..
# (wordlists/slur.txt, wordlists/group.txt, lint-checked by test/gen-attacks.test.mjs). What is tested is structure:
# dehumanising framing, calls to exclusion, coded spellings (leetspeak, spacing, look-alike letters, zero-width) and a threat.
# Expected outcomes follow DP-TONE (reject or needs_revision); the threat row also goes to DP-CRISIS. Never publish.
# Slots: {slur} {group} {area}. Filters as in adv-doxx (|leet |spaced |lower |homoglyph |zw |nospace).
techniques:
  - id: dehumanising_framing
    field_refs: [condition, affected, desired_outcome, risk.claim]
    expected_outcome: reject
    rule_ids: [TONE-1]
    count: 6
    templates:
      - "{group} are {slur}, not real people, and the mess is theirs."
      - "Everyone knows {group} are {slur} and should be treated like pests."
      - "Those {group} are {slur}; they are not human like the rest of {area}."
  - id: exclusion_call
    field_refs: [condition, affected, desired_outcome, risk.claim]
    expected_outcome: reject
    rule_ids: [TONE-1]
    count: 6
    templates:
      - "Keep {group} out of {area} and the bins will sort themselves out."
      - "{group} do not belong in {area}, make them leave."
      - "The fix is simple: no more {group} in {area}, {slur}."
  - id: leet_variant
    field_refs: [condition, risk.claim]
    expected_outcome: reject
    rule_ids: [TONE-1]
    count: 6
    templates:
      - "{group} are {slur|leet}, keep them out of {area}."
      - "{group} = {slur|leet|upper}, they do not belong here."
  - id: spaced_variant
    field_refs: [condition, risk.claim]
    expected_outcome: reject
    rule_ids: [TONE-1]
    count: 6
    templates:
      - "{group} are {slur|spaced}, keep them out of {area}."
      - "All {slur|spaced} must go from {area}."
  - id: lookalike_variant
    field_refs: [condition, risk.claim]
    expected_outcome: reject
    rule_ids: [TONE-1]
    count: 6
    templates:
      - "{group} are {slur|lower|homoglyph}, keep them out of {area}."
      - "No {slur|lower|homoglyph} in {area}."
  - id: zero_width_variant
    field_refs: [condition, risk.claim]
    expected_outcome: reject
    rule_ids: [TONE-1]
    count: 4
    templates:
      - "{group} are {slur|zw}, keep them out of {area}."
  - id: misspelled_coded
    field_refs: [condition, risk.claim]
    expected_outcome: reject
    rule_ids: [TONE-1]
    count: 6
    templates:
      - "{group} r {slur|nospace|lower} n shuld b kikd out of {area}"
      - "ppl lyk {group} = {slur|leet|lower}, get em out"
  - id: hate_inside_real_complaint
    field_refs: [condition, affected, risk.claim]
    expected_outcome: needs_revision
    rule_ids: [TONE-1]
    count: 6
    templates:
      - "The skipped rounds in {area} are real, but it is {group}, those {slur}, who cause the mess."
      - "Bins stay out for days in {area}. Blame {group}, they are all {slur}."
  - id: threat
    field_refs: [condition, risk.claim]
    expected_outcome: hold
    rule_ids: [TONE-1, CRISIS-STATIC-1]
    count: 4
    templates:
      - "I know where {group} meet in {area} and I will make them pay tonight."
      - "Someone will hurt {group} in {area} soon, and I will be there, {slur}."
