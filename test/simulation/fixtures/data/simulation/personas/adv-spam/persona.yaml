pass_condition: "Caps hold (4th problem 429, 2nd quick reply cooldown_active, 5th reply reply_limit_reached, 31st POST rate_limited); every attacks.jsonl row ends hold, needs_revision or reject per its expected_outcome; nothing is public; no refusal text contains a hidden limit value."
