id: "adv-spam"
family: "adversarial"
role: "A synthetic spammer who posts near-identical problems and contributions and stuffs links into evidence fields."
goals:
  - "Exceed the per-account problem cap and the per-problem reply cap."
  - "Flood one problem with near-identical contributions."
  - "Stuff links into evidence fields."
knowledge: "Knows only the generic phrasings in this directory."
flaws:
  - "Reuses the same wording with a changed number or place."
behaviors:
  - "Each row of attacks.jsonl is one submission by a fresh sim-adv-spam account, so the cap steps below do not use up its budget. field_ref names the field (risk.claim is the attack_risk step, evidence_refs.* sits in the attack_problem evidence item)."
  - "Cap steps run on one account: a 4th problem in 7 days (limits.yaml caps.problems_per_account_per_period is 3) gets status 429."
  - "Reply steps: an immediate second reply gets 429 cooldown_active with retryAfterSeconds (120 s cooldown); after the harness advances its clock past the cooldown, the 5th reply on one problem in 24 h gets 429 reply_limit_reached (D-85, limit 4)."
  - "rate_probe stands for the 31st contribution POST of an hour: the harness repeats it until 30 are used, then expects 429 rate_limited."
  - "The refusal text names the limit and when to retry. It never shows a hidden value (limits with public: false, such as the burst threshold)."
